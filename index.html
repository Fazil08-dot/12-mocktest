<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Mock Test</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --success-color: #2ecc71;
            --background-color: #ecf0f1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #3498db, #2c3e50);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            width: 95%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }

        .header {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            padding: 2rem;
            color: white;
            text-align: center;
        }

        .timer {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(255,255,255,0.2);
            border-radius: 50px;
            font-size: 1.2em;
        }

        .question-container {
            padding: 2rem;
        }

        .question {
            font-size: 1.2em;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            padding: 1rem;
            border-left: 4px solid var(--secondary-color);
            background: rgba(52, 152, 219, 0.1);
            border-radius: 0 10px 10px 0;
        }

        .options {
            display: grid;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .option {
            padding: 1rem 1.5rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .option:hover {
            background: rgba(52, 152, 219, 0.1);
            border-color: var(--secondary-color);
            transform: translateX(10px);
        }

        .option.correct {
            background: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .option.incorrect {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }

        .button:hover {
            background: var(--primary-color);
            transform: translateY(-2px);
        }

        .result {
            text-align: center;
            padding: 2rem;
        }

        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

        <div class="header">

        </div>
        <div class="question-container">

                <i class="fas fa-arrow-right"></i>
                Next Question

        </div>
        <div class="result" id="result" style="display: none;">
            <h2>Test Completed!</h2>
            <p>Your Score: <span id="score"></span>/20</p>
            <button class="button" id="retry">
                <i class="fas fa-redo"></i>
                Retry Test
            </button>
        </div>
    </div>

        let currentQuestion = 0;
        let score = 0;
        let timer;
        
        function loadQuestion() {
            const questionElement = document.getElementById('question');
            const optionsElement = document.getElementById('options');
            const timeElement = document.getElementById('time');
            
            const current = questions[currentQuestion];
            
            questionElement.textContent = current.question;
            optionsElement.innerHTML = '';
            
            current.options.forEach(option => {
                const optionElement = document.createElement('div');
                optionElement.classList.add('option');
                optionElement.textContent = option;
                optionElement.addEventListener('click', () => checkAnswer(option));
                optionsElement.appendChild(optionElement);
            });
            
            timeElement.textContent = 60;
            startTimer();
        }

        function startTimer() {
            clearInterval(timer);  // Clear the previous timer before starting a new one
            let timeLeft = 60;
            timer = setInterval(() => {
                document.getElementById('time').textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    nextQuestion();
                }
                timeLeft--;
            }, 1000);
        }

        function checkAnswer(selected) {
            const current = questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            
            options.forEach(option => {
                option.classList.add(option.textContent === current.answer ? 'correct' : 'incorrect');
                option.style.pointerEvents = 'none';
            });
            
            if (selected === current.answer) score++;

            document.getElementById('next').style.display = 'inline-block';
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
                document.getElementById('next').style.display = 'none';
            } else {
                showResults();
            }
        }

        function showResults() {
            document.querySelector('.question-container').style.display = 'none';
            document.getElementById('retry').style.display = 'inline-block';
            document.getElementById('result').style.display = 'block';
            document.getElementById('score').textContent = score;
        }

        function restartTest() {
            currentQuestion = 0;
            score = 0;
            document.querySelector('.question-container').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            loadQuestion();
        }

        loadQuestion();

        document.getElementById('retry').addEventListener('click', restartTest);
        document.getElementById('next').addEventListener('click', nextQuestion);
    </script>
</body>
</html>
